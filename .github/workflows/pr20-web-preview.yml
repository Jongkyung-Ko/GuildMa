# PR #20 only — Godot HTML5 preview.
# Publishes orphan branch preview-pr-20 + anonymous Vercel temporary URL.
# Does NOT use github-pages environment and does NOT overwrite main Pages.
name: pr20-web-preview

on:
  push:
    branches: [cursor/item-catalog-160-3dd7]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr20-web-preview
  cancel-in-progress: true

jobs:
  export-and-publish:
    name: Export & publish PR20 preview
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/cursor/item-catalog-160-3dd7' ||
      github.head_ref == 'cursor/item-catalog-160-3dd7'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.3.stable + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          include-templates: true
          use-dotnet: false

      - name: Import project assets
        run: |
          set -euo pipefail
          godot --headless --path . --import
        continue-on-error: true

      - name: Export Web to build/web
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Validate HTML / WASM / PCK / JS
        run: |
          set -euo pipefail
          ROOT=build/web
          echo "=== listing $ROOT ==="
          ls -lah "$ROOT"

          test -s "$ROOT/index.html"
          test -s "$ROOT/index.wasm"
          test -s "$ROOT/index.pck"
          test -s "$ROOT/index.js"

          python3 <<'PY'
          from pathlib import Path
          root = Path("build/web")
          wasm = (root / "index.wasm").read_bytes()
          if wasm[:4] != b"\0asm":
              raise SystemExit(f"FAIL: bad WASM magic {wasm[:4]!r}")
          html = (root / "index.html").read_text(encoding="utf-8", errors="replace")
          needed = ["index.js", "index.wasm", "index.pck"]
          missing = [n for n in needed if n not in html]
          if missing:
              raise SystemExit(f"FAIL: index.html missing refs {missing}")
          if "GuildMaster Phase 2-1 Emulator" in html:
              raise SystemExit("FAIL: emulator HTML detected — wrong artifact")
          pck = (root / "index.pck").read_bytes()
          required = [b"NotoSansKR-Regular", b"NotoSansKR-Bold", b"subcategory"]
          missing = [m.decode() for m in required if m not in pck]
          if missing:
              raise SystemExit(f"FAIL: missing markers in index.pck: {missing}")
          print("OK: wasm + html refs + PR20 catalog markers")
          PY

          touch "$ROOT/.nojekyll"
          printf '%s\n' "${GITHUB_SHA}" > "$ROOT/PREVIEW_SHA.txt"
          printf '%s\n' "PR #20 preview — do not use as main Pages source" > "$ROOT/README.txt"

      - name: Restore Vercel anonymous deploy state
        uses: actions/cache@v4
        with:
          path: build/web/.vercel
          key: pr20-vercel-anonymous-v1
          restore-keys: |
            pr20-vercel-anonymous-

      - name: Publish artifact branch preview-pr-20 (not Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: preview-pr-20
          force_orphan: true
          exclude_assets: ".vercel"
          commit_message: "chore: PR20 web preview ${{ github.sha }}"

      - name: Deploy anonymous Vercel temporary preview
        id: vercel
        continue-on-error: true
        working-directory: build/web
        env:
          # Vercel CLI often refuses anonymous --temporary when it detects Actions CI.
          CI: ""
          GITHUB_ACTIONS: ""
          VERCEL_FORCE_NO_BUILD_CACHE: "1"
        run: |
          set -euo pipefail
          # Redeploys reuse the same *.tmp.now URL when .vercel/anonymous.json is cached.
          # Anonymous deploys expire ~60m unless claimed via claim URL in the log.
          npx --yes vercel deploy --temporary --yes | tee /tmp/vercel-out.txt
          python3 <<'PY'
          import json, pathlib, re
          text = pathlib.Path("/tmp/vercel-out.txt").read_text(encoding="utf-8", errors="replace")
          data = None
          for chunk in reversed(text.strip().splitlines()):
              chunk = chunk.strip()
              if chunk.startswith("{") and chunk.endswith("}"):
                  try:
                      data = json.loads(chunk)
                      break
                  except json.JSONDecodeError:
                      pass
          url = None
          claim = None
          if isinstance(data, dict):
              dep = data.get("deployment") or {}
              url = dep.get("url") or data.get("url")
              claim = dep.get("claimUrl")
          if not url:
              m = re.search(r"https://[a-z0-9-]+\.tmp\.now", text)
              url = m.group(0) if m else None
          if not url:
              raise SystemExit("FAIL: could not parse Vercel preview URL")
          pathlib.Path("PREVIEW_URL.txt").write_text(url.strip() + "\n", encoding="utf-8")
          if claim:
              pathlib.Path("PREVIEW_CLAIM_URL.txt").write_text(claim.strip() + "\n", encoding="utf-8")
          print(f"PREVIEW_URL={url}")
          PY
          URL=$(tr -d '\n' < PREVIEW_URL.txt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Live preview URL: $URL"

      - name: Refresh preview-pr-20 with Vercel URL metadata
        if: steps.vercel.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: preview-pr-20
          force_orphan: true
          exclude_assets: ".vercel"
          commit_message: "chore: PR20 web preview URL ${{ github.sha }}"
